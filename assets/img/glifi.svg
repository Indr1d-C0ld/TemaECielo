<?xml version="1.0" encoding="UTF-8"?>
<!--
  Tema e Cielo — sprite dei glifi.

  Disegnati, non presi da Unicode: i caratteri ☉☽☿ vengono resi in modo
  incoerente da sistema a sistema — su qualche dispositivo diventano emoji
  colorate, su altri mancano — e per gli asteroidi spesso non esistono affatto.
  Qui il tratto, il peso e il colore li decidiamo noi.

  Uso:  <svg class="glifo"><use href="glifi.svg#gl-sole"></use></svg>
  Il colore segue currentColor. Ogni simbolo vive in una gabbia 24x24.
-->
