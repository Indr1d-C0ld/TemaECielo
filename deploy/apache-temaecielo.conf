# Tema e Cielo — configurazione Apache (hardening + URL puliti).
#
# Installata da deploy/00-bootstrap.sh in conf-available/ e abilitata con
# a2enconf. Non tocca i vhost esistenti.
#
# NB: se il DocumentRoot e' un collegamento simbolico, Apache usa il
# percorso col symlink NON risolto per <Directory>.

<Directory /var/www/html/temaecielo>
    AllowOverride None
    Options -Indexes +FollowSymLinks
    Require all granted

    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteBase /temaecielo/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [L]
    </IfModule>

    # Nega file sensibili sparsi.
    #
    # Sta DENTRO questo <Directory> di proposito. Prima era in fondo al file,
    # fuori da qualunque sezione: cosi' valeva per l'intero server, e un
    # README.md di un altro servizio ospitato sulla stessa macchina tornava 403
    # per colpa della conf di questo portale. Quei file non andavano serviti
    # comunque, ma una conf che porta il nome di un'applicazione non deve
    # decidere per le altre: chi cerchera' il colpevole lo cerchera' altrove.
    <FilesMatch "(^\.|\.(md|sql|lock|log|dist|example|esempio|ini|sh)$|composer\.(json|lock))">
        Require all denied
    </FilesMatch>

    # In tutto il portale c'e' un solo file PHP che il web deve eseguire:
    # index.php, il front controller. Ogni altro .php che finisse qui dentro —
    # un template copiato per sbaglio da un deploy fatto a mano, un backup
    # dell'editor, un file di appunti — non e' roba da servire, e va negato per
    # costruzione invece che sperando che non ci arrivi mai.
    #
    # ATTENZIONE all'ordine con cui Apache fonde le sezioni: <Files> e
    # <FilesMatch> vengono applicati DOPO <DirectoryMatch>. La riammissione qui
    # sotto vale quindi per qualunque index.php nell'albero, anche dentro una
    # cartella negata piu' in basso. Oggi di index.php ce n'e' uno solo e la
    # regola e' univoca: se un giorno ne nascesse un secondo dentro src/ o
    # views/, questa riga lo rimetterebbe in linea. Allora andra' stretta al
    # percorso, non al nome.
    <FilesMatch "\.php$">
        Require all denied
    </FilesMatch>
    <Files "index.php">
        Require all granted
    </Files>
</Directory>

# I permalink delle carte non devono finire nei motori di ricerca: un tema
# natale con nome e cognome indicizzato sarebbe un problema serio, e va escluso
# per costruzione e non per buona volonta'.
<IfModule mod_headers.c>
    <LocationMatch "^/temaecielo/(carta|sinastria)/">
        Header always set X-Robots-Tag "noindex, nofollow, noarchive"
    </LocationMatch>

    # Gli SVG generati sono immutabili per costruzione (chiave = impronta dei dati).
    <LocationMatch "^/temaecielo/assets/">
        Header set Cache-Control "public, max-age=604800"
    </LocationMatch>
</IfModule>

# Nega l'accesso web alle directory non pubbliche (qualsiasi prefisso di percorso).
<DirectoryMatch "/temaecielo/(src|db|bin|config|deploy|storage|views|tests|docs|fonti)(/|$)">
    Require all denied
</DirectoryMatch>
